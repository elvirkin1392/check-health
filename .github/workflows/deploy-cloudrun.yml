name: Deploy server to Cloud Run

on:
  push:
    branches: [master]
    paths-ignore:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write env vars for Cloud Run
        run: |
          cat > env.yaml << EOF
          CHECK_HEALTH_TELEGRAM_BOT_TOKEN: "${{ secrets.CHECK_HEALTH_TELEGRAM_BOT_TOKEN }}"
          CHECK_HEALTH_DB_HOST: "${{ secrets.CHECK_HEALTH_DB_HOST }}"
          CHECK_HEALTH_CHAT_ID: "${{ secrets.CHECK_HEALTH_CHAT_ID }}"
          JWT_SECRET: "${{ secrets.JWT_SECRET }}"
          CHECK_HEALTH_TELEGRAM_WEBHOOK_SECRET: "${{ secrets.CHECK_HEALTH_TELEGRAM_WEBHOOK_SECRET }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy check-health \
            --source . \
            --project check-health-437712 \
            --region europe-north1 \
            --env-vars-file env.yaml \
            --quiet
