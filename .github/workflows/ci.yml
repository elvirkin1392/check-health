name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Workspaces share one lockfile at the root; this installs both.
      - run: npm ci
      - run: npm run check-ts --workspace @check-health/server
      - run: npm test --workspace @check-health/server

  client:
    name: Client (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace @check-health/client
      - run: npm run check-ts --workspace @check-health/client
      - run: npm test --workspace @check-health/client
      - run: npm run build --workspace @check-health/client
