name: Deploy client to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Verify API host is configured
        run: |
          if [ -z "$VITE_CHECK_HEALTH_API_HOST" ]; then
            echo "::error::VITE_CHECK_HEALTH_API_HOST is empty. Set it in Settings > Secrets and variables > Actions, either as a repo Variable or a Secret."
            exit 1
          fi
        env:
          VITE_CHECK_HEALTH_API_HOST: ${{ vars.VITE_CHECK_HEALTH_API_HOST || secrets.VITE_CHECK_HEALTH_API_HOST }}

      - run: npm run build
        env:
          VITE_CHECK_HEALTH_API_HOST: ${{ vars.VITE_CHECK_HEALTH_API_HOST || secrets.VITE_CHECK_HEALTH_API_HOST }}

      # SPA fallback: GitHub Pages has no server-side rewrites, so a
      # direct link to e.g. /statistics would 404. Serving index.html
      # as 404.html lets the client-side router take over instead.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
